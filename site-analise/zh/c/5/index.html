<p>没有看到明确的关联，卢拉一方和弗拉维奥一方都是如此。在联邦众议员选举中本来更多投给左翼政党的地方，与同一州内首轮卢拉占比相同的市镇相比，卢拉的增长并没有明显更多；在更多投给右翼政党的地方，弗拉维奥也是如此。即使存在关联，也很小。州议员和参议员选举的情况相同。</p>
