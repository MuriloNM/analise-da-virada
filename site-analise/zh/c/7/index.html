<p>很接近，而且越来越接近：在10%～20%的投票机完成计票时，实时推算给卢拉的占比平均比他最终所得少1.06个百分点，给弗拉维奥的则多出同样幅度；不做推算的部分计票结果偏差为1.84个百分点。从计票进度达到60%起，误差降到0.1个百分点以下。事后用首轮逐个投票站的数据重建的推算，从计票进度达到0.5%起就已指向胜者，误差不超过半个百分点（探索性）。</p>
